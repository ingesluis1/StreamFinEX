name: Build Switch NRO

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
    - README.md
    - images/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nx:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    env:
      BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/switch-portlibs
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install portlibs
      run: |
        for pkg in mbedtls-3.6.7-1 libssh2-1.11.1-1 dav1d-1.5.4-1 curl-8.21.0-3 ffmpeg-7.1.5-5 libmpv-0.36.0-5; do
          dkp-pacman --noconfirm -U $BASE_URL/switch-${pkg}-any.pkg.tar.zst
        done
        git config --system --add safe.directory $GITHUB_WORKSPACE
    - name: Build nro
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_SWITCH=ON \
          -DBUILTIN_NSP=OFF \
          -DVERSION_BUILD=4
        make -C build StreamFin.nro -j$(nproc)
    - name: Symbolicate crash addresses
      run: |
        ELF=$(find build -maxdepth 3 -name '*.elf' | head -1)
        A2L=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-addr2line
        echo "elf: $ELF" | tee build/symbols.txt
        sha256sum build/StreamFin.nro | tee -a build/symbols.txt
        $A2L -f -C -p -i -e "$ELF"           0x14dc610 0x14dc5fc 0x14c8280           0x405788 0x405f80 0x408078 0x43b4c4 0x43ca40 0x43a5fc 0x40f648           0x409678 0x40a0ac 0x40ac6c 0x3d8de0 0x3d971c 0x3cdc2c           0x1c3d04 0x1c3e40 0x29599c 0x29fc24 0x2a9460 0x539a64 0x53cf78           | tee -a build/symbols.txt

    - name: Upload nro artifact
      uses: actions/upload-artifact@v4
      with:
        name: StreamFin-NintendoSwitch
        path: |
          build/StreamFin.nro
          build/symbols.txt
    - name: Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        name: StreamFinEX v0.3.9
        tag_name: v0.3.9
        files: build/StreamFin.nro
        body: |
          Exiting the player returns to the stream picker (episode-to-episode flow) instead of jumping home.
          Copy `StreamFin.nro` to `/switch/` on your SD card.
